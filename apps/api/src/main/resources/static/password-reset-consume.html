<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat | Reset Password</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/js/password-reset-consume-page.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="hero form-card">
        <div class="eyebrow">Password Reset</div>
        <h2>Consume the reset token</h2>
        <p class="subtle" data-token-preview></p>
        <form class="form-grid" data-reset-consume-form>
          <label>
            Reset token
            <input type="text" name="token" data-token-input required />
          </label>
          <label>
            New password
            <input type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" required />
          </label>
          <div class="actions">
            <button type="submit">Reset password</button>
            <a class="button secondary" href="/password-reset/request">Issue another token</a>
          </div>
        </form>
        <div class="message" data-form-message></div>
      </section>
    </main>
  </body>
</html>
