<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat | Request Reset</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/js/password-reset-request-page.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="hero form-card">
        <div class="eyebrow">Password Reset</div>
        <h2>Issue a one-time reset link</h2>
        <p>The local environment logs the reset URL once when it is issued. Unknown emails still return the same success response.</p>
        <form class="form-grid" data-reset-request-form>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <div class="actions">
            <button type="submit">Request reset</button>
            <a class="button secondary" href="/login">Back to sign in</a>
          </div>
        </form>
        <div class="message" data-form-message></div>
      </section>
    </main>
  </body>
</html>
