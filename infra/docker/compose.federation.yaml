name: chat-federation

services:
  db-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_a
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_a"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  app-a:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db-a:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-a:5432/chat_a
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: chat
      CHAT_STORAGE_ROOT: /app/storage
      CHAT_NODE_ID: node-a
      CHAT_FEDERATION_ENABLED: "true"
      CHAT_FEDERATION_PEER_DOMAIN: node-b.local
    ports:
      - "8081:8080"
    volumes:
      - ../../storage/node-a:/app/storage

  db-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_b
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_b"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  app-b:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db-b:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-b:5432/chat_b
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: chat
      CHAT_STORAGE_ROOT: /app/storage
      CHAT_NODE_ID: node-b
      CHAT_FEDERATION_ENABLED: "true"
      CHAT_FEDERATION_PEER_DOMAIN: node-a.local
    ports:
      - "8082:8080"
    volumes:
      - ../../storage/node-b:/app/storage
