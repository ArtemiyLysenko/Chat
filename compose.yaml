name: chat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chat}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker-local}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      CHAT_STORAGE_ROOT: /app/storage
      CHAT_XMPP_DOMAIN: ${CHAT_XMPP_DOMAIN:-localhost}
      CHAT_XMPP_PORT: 5222
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${XMPP_PORT:-5222}:5222"
    volumes:
      - ./storage:/app/storage

volumes:
  postgres-data:
