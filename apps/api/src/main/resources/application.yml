spring:
  profiles:
    default: local
  application:
    name: chat-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${SPRING_DATASOURCE_USERNAME:chat}
    password: ${SPRING_DATASOURCE_PASSWORD:chat}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

chat:
  storage-root: ${CHAT_STORAGE_ROOT:storage}
  node-id: ${CHAT_NODE_ID:local-node}
  auth:
    cookie-name: ${CHAT_AUTH_COOKIE_NAME:CHAT_SESSION}
    session-ttl: ${CHAT_AUTH_SESSION_TTL:P30D}
    password-reset-ttl: ${CHAT_AUTH_PASSWORD_RESET_TTL:PT15M}
    secure-cookie: ${CHAT_AUTH_SECURE_COOKIE:true}
  federation:
    enabled: ${CHAT_FEDERATION_ENABLED:false}
    peer-domain: ${CHAT_FEDERATION_PEER_DOMAIN:}
    peer-host: ${CHAT_FEDERATION_PEER_HOST:}
    peer-port: ${CHAT_FEDERATION_PEER_PORT:5222}
    shared-secret: ${CHAT_FEDERATION_SHARED_SECRET:}
  xmpp:
    enabled: ${CHAT_XMPP_ENABLED:true}
    domain: ${CHAT_XMPP_DOMAIN:localhost}
    port: ${CHAT_XMPP_PORT:5222}

---
spring:
  config:
    activate:
      on-profile: local,docker-local,test

chat:
  auth:
    secure-cookie: false
  xmpp:
    enabled: false
